server:
  port: 8082

spring:
  application:
    name: content-service

  # OceanBase 数据库配置（兼容 MySQL 协议）
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:2881}/${DB_NAME:forum_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

# JWT 配置
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.forum.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 禁用全局逻辑删除字段配置，因为 posts/users 表没有 deleted 字段
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.forum: DEBUG
    org.springframework.security: DEBUG
