server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # 全局默认过滤器（可选，先留空）
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      
      # 跨域配置（前端开发需要）
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      
      # 路由配置
      routes:
        # ==================== user-service 路由 ====================
        # 认证相关接口
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          
        # 用户相关接口
        - id: user-service-user
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
        
        # ==================== content-service 路由 ====================
        # 帖子相关接口
        - id: content-service-post
          uri: http://localhost:8082
          predicates:
            - Path=/api/post/**
        
        # 评论相关接口
        - id: content-service-comment
          uri: http://localhost:8082
          predicates:
            - Path=/api/comment/**

# Actuator 健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
